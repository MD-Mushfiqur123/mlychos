name: Build & Release MlychOS ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            tree

      - name: Build MlychOS Live ISO
        run: |
          chmod +x build_mlychos.sh
          sudo ./build_mlychos.sh

      - name: Verify ISO Physical Size (<300MB)
        run: |
          ISO_PATH="mlychos-1.0-amd64.iso"
          SIZE_BYTES=$(stat -c%s "$ISO_PATH")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "ISO Size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          if [ $SIZE_MB -gt 320 ]; then
            echo "ERROR: ISO exceeded strict target size!"
            exit 1
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlychos-1.0-amd64.iso
          path: mlychos-1.0-amd64.iso
          retention-days: 30

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: mlychos-1.0-amd64.iso
          body: |
            # ⚡ MlychOS 1.0 Release — Monochromatic Minimalist Debian Live ISO
            - **Target:** Sub-300MB (~265MB)
            - **Base:** Debian 12 Bookworm + Wayland (Labwc + Foot + Waybar)
            - **UI Theme:** Monochromatic Obsidian (#090a0f / #ffffff)
            - **Live User:** `mushfiqur` (Password: `mlych`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
